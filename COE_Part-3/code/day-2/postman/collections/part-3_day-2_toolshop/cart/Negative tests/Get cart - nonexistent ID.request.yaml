$kind: http-request
method: GET
url: "{{base_url}}/carts/{{nonexistentCartId}}"
order: 9000
description: "Negative: GET /carts/{cartId} with a well-formed but nonexistent cart ID. Expects 404 Not Found."
pathVariables:
  cartId: "{{nonexistentCartId}}"
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |
      pm.test("Status is 404 Not Found", function () {
          pm.response.to.have.status(404);
      });

      pm.test("Response body contains 'Requested item not found'", function () {
          pm.expect(pm.response.text()).to.include("Requested item not found");
      });
    language: text/javascript

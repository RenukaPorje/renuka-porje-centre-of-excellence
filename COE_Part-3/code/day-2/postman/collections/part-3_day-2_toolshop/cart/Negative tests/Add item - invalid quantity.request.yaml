$kind: http-request
method: POST
url: "{{base_url}}/carts/{{cartId}}"
order: 8000
description: "Negative: POST /carts/{id} with a non-integer quantity (invalidQuantity, a string). Expects 422 Unprocessable Entity."
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "product_id": "{{productId1}}",
      "quantity": "{{invalidQuantity}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 422 Unprocessable Entity", function () {
          pm.response.to.have.status(422);
      });
    language: text/javascript

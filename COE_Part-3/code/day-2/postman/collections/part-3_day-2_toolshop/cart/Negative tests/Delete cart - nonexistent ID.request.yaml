$kind: http-request
method: DELETE
url: "{{base_url}}/carts/{{nonexistentCartId}}"
order: 11000
description: "Negative: DELETE /carts/{cartId} with a well-formed but nonexistent cart ID. Expects 404 Not Found."
pathVariables:
  cartId: "{{nonexistentCartId}}"
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |
      pm.test("Status is 404 Not Found", function () {
          pm.response.to.have.status(404);
      });

      pm.test("Response body contains 'Cart doesnt exists'", function () {
          pm.expect(pm.response.text()).to.include("Cart doesnt exists");
      });
    language: text/javascript

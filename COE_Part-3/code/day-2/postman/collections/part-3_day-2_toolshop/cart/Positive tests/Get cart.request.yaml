$kind: http-request
name: Get cart
method: GET
url: '{{base_url}}/carts/{{cartId}}'
order: 3000
description: 'Retrieve the cart by cartId. Checks the id matches cartId and that the item added earlier is in cartItems with the quantity sent.'
pathVariables:
  - key: cartId
    value: '{{cartId}}'
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response id matches the requested cartId", function () {
          pm.expect(pm.response.json().id).to.equal(pm.collectionVariables.get("cartId"));
      });
      pm.test("Cart contains the added product with the quantity sent", function () {
          const items = pm.response.json().cart_items;
          pm.expect(items, "cart items array").to.be.an("array").with.lengthOf(1);
          pm.expect(items[0].product_id).to.equal(pm.collectionVariables.get("productId1"));
          pm.expect(items[0].quantity).to.equal(Number(pm.collectionVariables.get("quantity")));
      });
      pm.test("Cart item fields have the expected types", function () {
          const item = pm.response.json().cart_items[0];
          pm.expect(item.id).to.be.a("string");
          pm.expect(item.quantity).to.be.a("number");
          pm.expect(item.product_id).to.be.a("string");
          pm.expect(item.product).to.include.all.keys("id", "name", "price", "in_stock");
          pm.expect(item.product.price).to.be.a("number");
          pm.expect(item.product.in_stock).to.be.a("boolean");
      });
      pm.test("Content-Type is application/json", function () {
          pm.response.to.have.header("Content-Type");
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

$kind: http-request
method: POST
url: "{{base_url}}/carts/{{cartId}}"
order: 2000
description: Add a product to the cart identified by cartId. Uses productId and quantity collection variables.
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "product_id": "{{productId1}}",
      "quantity": {{quantity}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has result field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("result").that.is.a("string").and.not.empty;
          pm.expect(json.result).to.equal("item added or updated");
      });
      pm.test("Content-Type is application/json", function () {
          pm.response.to.have.header("Content-Type");
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
    language: text/javascript

$kind: http-request
name: Delete cart
method: DELETE
url: '{{base_url}}/carts/{{cartId}}'
order: 6000
description: 'Delete the entire cart by cartId. Expects 204 No Content with an empty body.'
pathVariables:
  - key: cartId
    value: '{{cartId}}'
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204 No Content", function () {
          pm.response.to.have.status(204);
      });
      pm.test("Response body is empty", function () {
          pm.expect(pm.response.text()).to.equal("");
      });

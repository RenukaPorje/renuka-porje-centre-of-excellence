name: Day 5 Playwright tests

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: COE_Part-3/code/day-5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install packages
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Traces are recorded on the first retry of a failed test, as set in playwright.config.ts. The first run used --trace on, to get a trace from a passing test
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: COE_Part-3/code/day-5/playwright-report/
          retention-days: 30
